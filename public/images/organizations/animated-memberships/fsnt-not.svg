<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 208" role="img" aria-labelledby="title desc">
  <title id="title">FSNT-NOT membership tile</title>
  <desc id="desc">Animated editorial SVG tile for the Federation of Scientific and Technical Associations with blueprint lines, engineering nodes, and technical motion around the FSNT-NOT acronym.</desc>
  <defs>
    <linearGradient id="g" x1="14%" y1="10%" x2="88%" y2="90%">
      <stop offset="0" stop-color="#f97316" stop-opacity=".98"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f97316" stop-opacity=".9"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="34%" cy="20%" r="80%">
      <stop offset="0" stop-color="#f97316" stop-opacity=".24"/>
      <stop offset="0.6" stop-color="#60a5fa" stop-opacity=".10"/>
      <stop offset="1" stop-color="#05070b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plateGlow" cx="50%" cy="44%" r="76%">
      <stop offset="0" stop-color="#f97316" stop-opacity=".24"/>
      <stop offset="1" stop-color="#05070b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="12" y="12" width="184" height="184" rx="36" />
    </clipPath>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  
    <style>
      :root { color-scheme: dark; }
      .plate { fill: rgba(5, 7, 11, 0.78); stroke: rgba(255,255,255,0.08); stroke-width: 1.2; }
      .hair { stroke: rgba(255,255,255,0.12); stroke-width: 1; fill: none; }
      .soft { opacity: .45; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pulse { animation: pulse 3.6s ease-in-out infinite; transform-origin: 104px 104px; }
      .pulse2 { animation: pulse 4.8s ease-in-out infinite; transform-origin: 104px 104px; }
      .spin { animation: spin 18s linear infinite; transform-origin: 104px 104px; }
      .spin-rev { animation: spinRev 22s linear infinite; transform-origin: 104px 104px; }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float2 7.2s ease-in-out infinite; }
      .drift { animation: drift 8.5s linear infinite; }
      .dash { stroke-dasharray: 10 10; animation: dash 9s linear infinite; }
      .blink { animation: blink 2.8s ease-in-out infinite; }
      .breathe { animation: breathe 4.5s ease-in-out infinite; }
      .tiny { font: 700 9px/1 "JetBrains Mono", "Consolas", monospace; letter-spacing: 2.1px; text-transform: uppercase; }
      .label { font: 700 9px/1 "JetBrains Mono", "Consolas", monospace; letter-spacing: 1.8px; text-transform: uppercase; }
      .code { font: 800 40px/1 "Inter", Arial, sans-serif; letter-spacing: -1px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinRev { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .84; } 50% { transform: scale(1.03); opacity: 1; } }
      @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: .88; } }
      @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      @keyframes float2 { 0%,100% { transform: translateY(0px) translateX(0px); } 50% { transform: translateY(4px) translateX(3px); } }
      @keyframes drift { from { transform: translateX(-14px);} to { transform: translateX(14px);} }
      @keyframes dash { to { stroke-dashoffset: -80; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .pulse2, .spin, .spin-rev, .float, .float2, .drift, .dash, .blink, .breathe { animation: none !important; }
      }
    </style>

  <rect width="208" height="208" rx="46" fill="#05070b"/>
  <rect x="1" y="1" width="206" height="206" rx="45" fill="url(#halo)"/>
  <rect x="12" y="12" width="184" height="184" rx="36" fill="rgba(255,255,255,.02)" stroke="url(#g)" stroke-width="1.5" opacity=".6"/>
  <g clip-path="url(#clip)">
    <g opacity=".48">
      <path d="M24 56h160M24 88h160M24 120h160M24 152h160M56 24v160M88 24v160M120 24v160M152 24v160" class="line" stroke="#60a5fa" stroke-width="1"/>
    </g>
    <g class="spin">
      <circle cx="58" cy="58" r="14" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 5" opacity=".55"/>
      <circle cx="158" cy="146" r="18" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 6" opacity=".5"/>
    </g>
    <g class="float2">
      <path d="M48 148 86 110 110 126 156 78" class="line" stroke="#f97316" stroke-width="2.4"/>
      <circle cx="48" cy="148" r="5" fill="#f97316"/>
      <circle cx="86" cy="110" r="5" fill="#60a5fa"/>
      <circle cx="110" cy="126" r="5" fill="#f97316"/>
      <circle cx="156" cy="78" r="5" fill="#60a5fa"/>
    </g>
    </g>
  <circle cx="104" cy="104" r="54" class="plate"/>
  <circle cx="104" cy="104" r="54" fill="url(#plateGlow)" opacity=".9"/>
  <circle cx="104" cy="104" r="66" fill="none" stroke="url(#g)" stroke-width="1" opacity=".2" class="pulse"/>
  <text x="104" y="111" text-anchor="middle" class="code" font-size="24" fill="#f8fbff">FSNT-NOT</text>
  <text x="104" y="145" text-anchor="middle" class="label" fill="#f97316" opacity=".92">technical federation</text>
</svg>
