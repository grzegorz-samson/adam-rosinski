<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 208" role="img" aria-labelledby="title desc">
<title id="title">EAA affiliation mark</title>
<desc id="desc">Decorative local SVG mark used as a neutral visual placeholder for an organisation membership card. It is not an official logo.</desc>
<defs>
  <linearGradient id="g" x1="15%" y1="10%" x2="90%" y2="90%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity=".95"/>
    <stop offset="1" stop-color="#fbbf24" stop-opacity=".72"/>
  </linearGradient>
  <radialGradient id="halo" cx="55%" cy="38%" r="68%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity=".28"/>
    <stop offset="1" stop-color="#05070b" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="208" height="208" rx="46" fill="#05070b"/>
<rect x="1" y="1" width="206" height="206" rx="45" fill="url(#halo)"/>
<rect x="12" y="12" width="184" height="184" rx="36" fill="none" stroke="url(#g)" stroke-width="2" opacity=".55"/>
<path d="M42 132 86 72 136 118 166 56" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".58"/>
<circle cx="42" cy="132" r="8" fill="#60a5fa" opacity=".8"/><circle cx="86" cy="72" r="7" fill="#fbbf24" opacity=".8"/>
<circle cx="136" cy="118" r="9" fill="#60a5fa" opacity=".7"/><circle cx="166" cy="56" r="7" fill="#fbbf24" opacity=".8"/>
<circle cx="104" cy="104" r="54" fill="#05070b" opacity=".72"/>
<circle cx="104" cy="104" r="54" fill="url(#g)" opacity=".08"/>
<text x="104" y="113" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="800" letter-spacing="-1" fill="#fff">EAA</text>
<text x="104" y="158" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="2" fill="#60a5fa" opacity=".88">MEMBERSHIP</text>
</svg>
