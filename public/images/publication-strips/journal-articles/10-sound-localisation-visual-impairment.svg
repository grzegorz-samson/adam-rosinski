<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Sound Localisation in Individuals with Visual Impairment â€” visual strip</title>
  <desc id="desc">localisation radar, binaural points, accessibility-oriented spatial hearing</desc>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#2EA8FF" stop-opacity="0"/>
      <stop offset="34%" stop-color="#2EA8FF" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset="58%" stop-color="#2EA8FF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#2EA8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" opacity=".25"/>
    </pattern>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#FFFFFF" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="350" y="0" width="550" height="180" fill="url(#glow)"/>
  <g opacity=".18"><rect x="520" y="18" width="310" height="144" fill="url(#dots)"/></g>
  <g transform="translate(650 90)" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity=".54">
    <circle r="32"/><circle r="64"/><circle r="96"/><path d="M-110 0H110M0-80V80"/><path d="M0 0L82 -48"/>
  </g>
  <g fill="#FFFFFF" filter="url(#softGlow)"><circle cx="732" cy="42" r="4"/><circle cx="586" cy="125" r="3"/><circle cx="650" cy="90" r="5"/></g>
  <g stroke="#FFFFFF" stroke-linecap="round" opacity=".35"><path d="M430 122C520 78 596 76 650 90S760 126 890 70"/></g>
</svg>


