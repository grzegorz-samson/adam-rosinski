<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">The Training of Music Teachers in Media Education â€” visual strip</title>
  <desc id="desc">media education constellation, pedagogy nodes, screen layers</desc>

  <defs>
