<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">The Use of Virtual Musical Instruments in Timbre Recognition Training â€” visual strip</title>
  <desc id="desc">virtual keyboard, timbre spectrum, training pulses</desc>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="34%" stop-color="#34D399" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity=".22"/>
