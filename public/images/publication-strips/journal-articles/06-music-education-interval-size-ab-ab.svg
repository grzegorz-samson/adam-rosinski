<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Influence of Music Education and Interval Size on Grouping of the AB-AB Sequence Sounds â€” visual strip</title>
  <desc id="desc">AB-AB interval ladder, education grouping diagram</desc>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="34%" stop-color="#34D399" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#56D8FF" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#56D8FF" stop-opacity=".30"/>
      <stop offset="58%" stop-color="#34D399" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#56D8FF" opacity=".25"/>
    </pattern>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#56D8FF" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="350" y="0" width="550" height="180" fill="url(#glow)"/>
  <g opacity=".18"><rect x="520" y="18" width="310" height="144" fill="url(#dots)"/></g>
  <g stroke="#56D8FF" stroke-linecap="round" fill="none">
    <path d="M430 132L810 46" stroke-width="1.2" opacity=".42"/>
    <path d="M430 92L810 92" stroke-width="1.2" opacity=".28"/>
    <path d="M430 52L810 138" stroke-width="1.2" opacity=".28"/>
  </g>
  <g fill="#56D8FF" filter="url(#softGlow)">
    <circle cx="455" cy="126" r="4"/><circle cx="515" cy="112" r="4"/><circle cx="575" cy="98" r="4"/><circle cx="635" cy="84" r="4"/><circle cx="695" cy="70" r="4"/><circle cx="755" cy="56" r="4"/>
  </g>
  <g font-family="monospace" font-size="14" fill="#56D8FF" opacity=".66">
    <text x="432" y="42">A</text><text x="492" y="42">B</text><text x="552" y="42">A</text><text x="612" y="42">B</text>
  </g>
</svg>


