<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Multivariantism of Auditory Perceptions as a Significant Element of the Auditory Scene Analysis Concept â€” visual strip</title>
  <desc id="desc">multiple perception variants, branching nodes, alternate paths</desc>

  <defs>
