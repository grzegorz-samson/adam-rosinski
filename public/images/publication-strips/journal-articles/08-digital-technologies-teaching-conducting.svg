<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Digital technologies in teaching conducting â€” visual strip</title>
  <desc id="desc">conducting gesture paths, digital baton traces</desc>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#56D8FF" stop-opacity="0"/>
      <stop offset="34%" stop-color="#56D8FF" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity=".22"/>
