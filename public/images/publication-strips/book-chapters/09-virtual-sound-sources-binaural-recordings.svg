<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Localisation of Virtual Sound Sources in Binaural Recordings â€” visual strip</title>
  <desc id="desc">binaural head, virtual sources, localisation rays</desc>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#2EA8FF" stop-opacity="0"/>
      <stop offset="34%" stop-color="#2EA8FF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset="58%" stop-color="#2EA8FF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#2EA8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" opacity=".23"/>
    </pattern>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#FFFFFF" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="350" y="0" width="550" height="180" fill="url(#glow)"/>
  <rect x="530" y="18" width="310" height="144" fill="url(#dots)" opacity=".22"/>
<g fill="none" stroke="#FFFFFF" opacity=".55"><path d="M592 70C574 80 566 100 580 122"/><path d="M686 70C704 80 712 100 698 122"/><circle cx="640" cy="94" r="42"/><circle cx="640" cy="94" r="74"/><path d="M640 94L780 48M640 94L772 128M640 94L510 60"/></g><g fill="#FFFFFF" filter="url(#softGlow)"><circle cx="780" cy="48" r="4"/><circle cx="772" cy="128" r="4"/><circle cx="510" cy="60" r="4"/></g>
</svg>

