<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Keyboard as a Stimulator in Timbre Recognition Training — visual strip</title>
  <desc id="desc">A decorative visual strip showing a correctly arranged two-octave piano keyboard with timbre recognition pulses.</desc>
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="34%" stop-color="#34D399" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity=".30"/>
      <stop offset="58%" stop-color="#34D399" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFB347" opacity=".23"/>
    </pattern>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#FFB347" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
  </defs>
