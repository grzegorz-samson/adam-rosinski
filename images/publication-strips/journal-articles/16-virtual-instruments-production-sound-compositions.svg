<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" preserveAspectRatio="xMaxYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">The Use of Virtual Musical Instruments in the Production of Sound for Musical Compositions and Arrangements â€” visual strip</title>
  <desc id="desc">virtual instrument patch matrix, sound design envelopes</desc>

  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#12D6D6" stop-opacity="0"/>
      <stop offset="34%" stop-color="#12D6D6" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity=".30"/>
      <stop offset="58%" stop-color="#12D6D6" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#12D6D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFB347" opacity=".25"/>
    </pattern>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#FFB347" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
  </defs>
  <g opacity=".18"><rect x="520" y="18" width="310" height="144" fill="url(#dots)"/></g>
  <g fill="none" stroke="#FFB347" opacity=".45">
    <rect x="460" y="38" width="320" height="112" rx="16"/>
    <path d="M500 70H740M500 108H740"/>
  </g>
  <g fill="#FFB347" opacity=".76">
    <circle cx="520" cy="70" r="5"/><circle cx="600" cy="108" r="5"/><circle cx="686" cy="70" r="5"/><circle cx="742" cy="108" r="5"/>
  </g>
  <g stroke="#12D6D6" fill="none" opacity=".55">
    <path d="M520 70C560 40 640 138 686 70"/>
    <path d="M600 108C648 132 700 82 742 108"/>
  </g>
</svg>



