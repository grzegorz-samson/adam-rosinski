  <title id="title">The Use of Virtual Musical Instruments in Timbre Recognition Training — visual strip</title>
  <desc id="desc">A decorative visual strip showing a correctly arranged two-octave piano keyboard, virtual timbre spectrum bars, and training pulses.</desc>
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="34%" stop-color="#34D399" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
