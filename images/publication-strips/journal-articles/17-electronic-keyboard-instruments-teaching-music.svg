      <stop offset="58%" stop-color="#56D8FF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#56D8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
